name: PR Risk Analysis

on:
  create:
    branches:
      - '**'

permissions:
  contents: read
  pull-requests: read
  checks: read
  statuses: read

jobs:
  check-branch-source:
    runs-on: ubuntu-latest
    outputs:
      is_new_from_main: ${{ steps.check-main.outputs.is_new_from_main }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if branch created from main
        id: check-main
        run: |
          # Get the merge base to determine if this is a new branch from main
          git fetch origin main
          MERGE_BASE=$(git merge-base origin/main ${{ github.sha }})
          echo "Merge base: $MERGE_BASE"
          echo "Current commit: ${{ github.sha }}"

          # If merge base equals current commit, it's a new branch from main
          if [ "$MERGE_BASE" == "${{ github.sha }}" ]; then
            echo "is_new_from_main=true" >> $GITHUB_OUTPUT
            echo "✅ Branch is new from main - running risk analysis"
          else
            echo "is_new_from_main=false" >> $GITHUB_OUTPUT
            echo "ℹ️  Branch is not new from main - skipping analysis"
          fi

  risk-analysis:
    needs: check-branch-source
    runs-on: ubuntu-latest
    if: needs.check-branch-source.outputs.is_new_from_main == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run PR Risk Analysis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANALYSIS_DAYS: 7
        run: |
          python .github/scripts/analyze-pr-risks.py \
            --repo "${{ github.repository }}" \
            --token "${{ secrets.GITHUB_TOKEN }}" \
            --days ${{ env.ANALYSIS_DAYS }}

      - name: Check risk thresholds
        if: always()
        run: |
          python .github/scripts/check-risk-threshold.py

      - name: Generate summary for GitHub Actions
        if: always()
        run: |
          python .github/scripts/generate-summary.py >> $GITHUB_STEP_SUMMARY

      - name: Upload risk report artifact
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: pr-risk-analysis-report
          path: pr-risk-report.json
          retention-days: 30

      - name: Notify on critical risks
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (fs.existsSync('pr-risk-report.json')) {
              const report = JSON.parse(fs.readFileSync('pr-risk-report.json', 'utf8'));
              const summary = report.summary;

              core.setFailed(
                `❌ PR Risk Analysis Failed\n` +
                `Critical Risks: ${summary.critical_risks}\n` +
                `High Risks: ${summary.high_risks}\n` +
                `Risk Percentage: ${summary.risk_percentage}%`
              );
            }
