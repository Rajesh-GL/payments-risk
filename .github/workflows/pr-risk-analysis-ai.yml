name: PR Risk Analysis with AI

on:
  create:
    branches:
      - '**'

permissions:
  contents: read
  pull-requests: read
  checks: read
  statuses: read

jobs:
  check-branch-source:
    runs-on: ubuntu-latest
    outputs:
      is_new_from_main: ${{ steps.check-main.outputs.is_new_from_main }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if branch created from main
        id: check-main
        run: |
          git fetch origin main
          MERGE_BASE=$(git merge-base origin/main ${{ github.sha }})

          if [ "$MERGE_BASE" == "${{ github.sha }}" ]; then
            echo "is_new_from_main=true" >> $GITHUB_OUTPUT
            echo "✅ Branch is new from main - running AI risk analysis"
          else
            echo "is_new_from_main=false" >> $GITHUB_OUTPUT
            echo "ℹ️  Branch is not new from main - skipping analysis"
          fi

  ai-risk-analysis:
    needs: check-branch-source
    runs-on: ubuntu-latest
    if: needs.check-branch-source.outputs.is_new_from_main == 'true'
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify required secrets are set
        run: |
          if [ -z "${{ secrets.ANTHROPIC_API_KEY }}" ]; then
            echo "::error::ANTHROPIC_API_KEY secret is not set. Add it under Settings > Secrets and variables > Actions before this workflow can run."
            exit 1
          fi
          echo "✅ ANTHROPIC_API_KEY is present"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests anthropic playwright

      - name: Install Chromium for Playwright
        run: playwright install --with-deps chromium

      - name: Generate Release Risk Assessment
        id: risk-card
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANALYSIS_DAYS: 7
        run: |
          python .github/scripts/generate-release-risk-card.py \
            --repo "${{ github.repository }}" \
            --github-token "${{ secrets.GITHUB_TOKEN }}" \
            --claude-token "${{ secrets.ANTHROPIC_API_KEY }}" \
            --days ${{ env.ANALYSIS_DAYS }}

      - name: Upload release risk artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-risk-assessment
          path: |
            release-risk-report.json
            release-risk-card.png
            release-risk-card.html
          retention-days: 30

      - name: Fail if release risk is critical
        if: failure()
        run: |
          echo "❌ Release risk assessment failed or flagged CRITICAL risk - see the Job Summary and uploaded artifact for details"
          exit 1
