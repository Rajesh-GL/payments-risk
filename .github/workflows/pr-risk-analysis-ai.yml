name: PR Risk Analysis with AI

on:
  create:
    branches:
      - '**'

permissions:
  contents: read
  pull-requests: read
  checks: read
  statuses: read

jobs:
  check-branch-source:
    runs-on: ubuntu-latest
    outputs:
      is_new_from_main: ${{ steps.check-main.outputs.is_new_from_main }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if branch created from main
        id: check-main
        run: |
          git fetch origin main
          MERGE_BASE=$(git merge-base origin/main ${{ github.sha }})

          if [ "$MERGE_BASE" == "${{ github.sha }}" ]; then
            echo "is_new_from_main=true" >> $GITHUB_OUTPUT
            echo "✅ Branch is new from main - running AI risk analysis"
          else
            echo "is_new_from_main=false" >> $GITHUB_OUTPUT
            echo "ℹ️  Branch is not new from main - skipping analysis"
          fi

  ai-risk-analysis:
    needs: check-branch-source
    runs-on: ubuntu-latest
    if: needs.check-branch-source.outputs.is_new_from_main == 'true'
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify required secrets are set
        run: |
          if [ -z "${{ secrets.ANTHROPIC_API_KEY }}" ]; then
            echo "::error::ANTHROPIC_API_KEY secret is not set. Add it under Settings > Secrets and variables > Actions before this workflow can run."
            exit 1
          fi
          echo "✅ ANTHROPIC_API_KEY is present"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests anthropic

      - name: Run AI-Powered Risk Analysis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANALYSIS_DAYS: 7
        run: |
          python .github/scripts/ai-risk-analyzer.py \
            --repo "${{ github.repository }}" \
            --github-token "${{ secrets.GITHUB_TOKEN }}" \
            --claude-token "${{ secrets.ANTHROPIC_API_KEY }}" \
            --days ${{ env.ANALYSIS_DAYS }}

      - name: Check AI risk thresholds
        if: always()
        run: |
          python .github/scripts/check-ai-risk-threshold.py

      - name: Generate AI summary
        if: always()
        run: |
          python .github/scripts/generate-ai-summary.py >> $GITHUB_STEP_SUMMARY

      - name: Upload AI risk report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-risk-analysis-ai-report
          path: pr-risk-report-ai.json
          retention-days: 30

      - name: Comment with AI insights
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (fs.existsSync('pr-risk-report-ai.json')) {
              const report = JSON.parse(fs.readFileSync('pr-risk-report-ai.json', 'utf8'));

              let comment = "## 🤖 AI Risk Analysis Results\n\n";
              const summary = report.summary;

              if (summary.critical_risks > 0) {
                comment += `🔴 **${summary.critical_risks} Critical Risk(s) Found**\n`;
              }
              if (summary.high_risks > 0) {
                comment += `🟠 **${summary.high_risks} High Risk(s) Found**\n`;
              }
              if (summary.critical_risks === 0 && summary.high_risks === 0) {
                comment += "✅ **No significant risks detected by AI**\n";
              }

              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment
              });
            }

      - name: Fail if critical risks
        if: failure()
        run: |
          echo "❌ Critical risks detected - build failed"
          exit 1
